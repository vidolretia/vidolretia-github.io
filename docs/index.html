<!DOCTYPE html>

<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>さとうのおうち</title>

<style>
:root{
    --bg1:#eef8ff;
    --bg2:#fdf8ff;
    --card:rgba(255,255,255,.55);
    --text:#4a5870;
    --accent:#9fdfff;
    --accent2:#d8c8ff;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    font-family:
        "Hiragino Sans",
        "Yu Gothic",
        sans-serif;

    background:
        radial-gradient(circle at 20% 20%, #ffffff 0%, transparent 35%),
        radial-gradient(circle at 80% 30%, #dff4ff 0%, transparent 35%),
        linear-gradient(135deg,var(--bg1),var(--bg2));

    color:var(--text);
}

.float{
    position:absolute;
    font-size:1.5rem;
    opacity:.3;
    animation:float 12s linear infinite;
}

@keyframes float{
    from{
        transform:translateY(110vh) rotate(0deg);
    }
    to{
        transform:translateY(-20vh) rotate(360deg);
    }
}

.card{
    width:min(92vw,420px);

    backdrop-filter:blur(16px);
    background:var(--card);

    border:1px solid rgba(255,255,255,.8);

    border-radius:32px;

    padding:32px 24px;

    text-align:center;

    box-shadow:
        0 10px 40px rgba(150,180,255,.18);
}

.icon{
    width:170px;
    height:170px;

    border-radius:50%;
    object-fit:cover;

    border:4px solid rgba(255,255,255,.95);

    box-shadow:
        0 0 30px rgba(180,220,255,.5);

    margin-bottom:18px;
}

.title{
    font-size:2rem;
    font-weight:700;
    margin-bottom:8px;
}

.subtitle{
    color:#7b89a6;
    margin-bottom:18px;
}

.badges{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:8px;
    margin-bottom:20px;
}

.badge{
    padding:8px 14px;
    border-radius:999px;

    background:
        linear-gradient(
            135deg,
            rgba(159,223,255,.35),
            rgba(216,200,255,.35)
        );

    font-size:.9rem;
}

.profile{
    line-height:1.8;
    margin-bottom:24px;
}

.quote{
    padding:14px;

    border-radius:18px;

    background:
        rgba(255,255,255,.55);

    font-size:.95rem;

    min-height:70px;
}

.footer{
    margin-top:18px;
    font-size:.8rem;
    opacity:.6;
}
</style>

</head>

<body>

<div class="float" style="left:8%;animation-delay:0s;">🪽</div>
<div class="float" style="left:20%;animation-delay:2s;">⭐</div>
<div class="float" style="left:40%;animation-delay:5s;">🩵</div>
<div class="float" style="left:60%;animation-delay:1s;">☁️</div>
<div class="float" style="left:80%;animation-delay:4s;">✨</div>
<div class="float" style="left:92%;animation-delay:7s;">🪽</div>

<div class="card">

```
<img src="icon002.jpg" alt="さとう" class="icon">

<div class="title">🪽 さとう 🪽</div>

<div class="subtitle">
    かわいいものを愛する美少女
</div>

<div class="badges">
    <div class="badge">🎀 アジフライ</div>
    <div class="badge">🐟 うなぎ</div>
    <div class="badge">🍣 エンガワ</div>
    <div class="badge">🍜 蘭州牛肉麺</div>
</div>

<div class="profile">
    かわいいものを追いかけながら<br>
    のんびりインターネットを漂う住人。<br><br>

    気になった言葉を集めたり、<br>
    好きな世界観に浸ったり、<br>
    今日もどこかでふわふわ活動中。
</div>

<div class="quote" id="quote">
    読み込み中...
</div>

<div class="footer">
    さとうのおうち
</div>
```

</div>

<script>
const sayings = [
"かわいいは装備ではなく信念。",
"エンガワを見つけたら迷わず確保。",
"好きなように生きていいよ… だって、それがいちばんすてきだから",
"牛肉麺は突然食べたくなる。",
"好きな世界観は何個あってもいい。",
"迷ったらかわいい方を選ぶ。",
"羽根はなくても飛べる日がある。",
"今日の自分が一番新しい自分。"
];

const q = document.getElementById("quote");
q.textContent =
    sayings[Math.floor(Math.random()*sayings.length)];
</script>

</body>
</html>
